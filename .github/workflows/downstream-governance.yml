name: Downstream governance

on:
  workflow_dispatch:
  push:
    branches:
      - 'fiet/v0.14'
  pull_request:
    branches:
      - 'fiet/v0.14'

permissions:
  contents: read

jobs:
  baseline-and-ledger:
    name: Canonical baseline and patch ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate downstream patch ledger schema
        run: bash scripts/test-downstream-patches-schema.sh

      - name: Reject duplicate downstream patch IDs
        run: >-
          jq -e '[.patches[].id] as $ids |
          ($ids | length) == ($ids | unique | length)'
          downstream-patches.json

      - name: Reject unledgered downstream source paths
        run: bash scripts/test-downstream-patch-coverage.sh

      - name: Verify exact canonical baseline ancestry
        run: bash scripts/test-verify-canonical-baseline.sh

      - name: Test non-mutating canonical comparison
        run: bash scripts/test-report-canonical-sync.sh
